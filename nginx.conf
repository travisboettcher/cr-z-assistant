server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every asset filename, so a given URL's contents can
    # never change. Caching them for a year removes almost all requests after
    # the first visit — which matters on a tablet on a slow connection next to
    # a table.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached: it is what points at the fingerprinted
    # bundles, so a cached copy would keep serving the previous deploy until
    # someone thought to hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fall back to the app for unknown paths. Phase 0 has a single screen and no
    # router, so nothing reaches this today; it is here so that adding routing
    # in a later phase does not turn every deep link into a 404 that only shows
    # up once the app is deployed.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
